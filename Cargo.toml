[package]
name = "underglow"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Reactive keyboard lighting and notifications for Wooting keyboards"
default-run = "underglow"

[features]
default = []
gui = ["dep:eframe", "dep:tray-icon"]

[[bin]]
name = "underglow-gui"
path = "src/bin/underglow-gui.rs"
required-features = ["gui"]

[[bin]]
name = "underglow-service"
path = "src/bin/underglow-service.rs"
required-features = ["gui"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ctrlc = { version = "3.5", features = ["termination"] }
eframe = { version = "0.31.1", optional = true, default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
libloading = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "0.9"
ureq = "2.12"

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = { version = "0.26", optional = true, default-features = false }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
