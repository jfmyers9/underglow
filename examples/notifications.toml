schema_version = 1
continuous = true
brightness = 96
fps = 30

[signal]
kind = "static-effect"
effect = "comet"

# Timer only: this example performs no network requests or commands.
[[notifications]]
id = "focus-timer"
priority = 20
duration_seconds = 5
zones = ["function", "arrows"]
statuses = ["break", "overtime"]
[notifications.signal]
kind = "focus-cockpit"
focus_minutes = 25
break_minutes = 5
cycles = 1

