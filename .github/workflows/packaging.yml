name: Packaging fixtures
on:
  push:
    paths: ['packaging/**', 'scripts/**', 'assets/icon/**', 'src/**', 'tests/toys_cli.rs', 'Cargo.*', 'Makefile', '.github/workflows/packaging.yml']
  pull_request:
    paths: ['packaging/**', 'scripts/**', 'assets/icon/**', 'src/**', 'tests/toys_cli.rs', 'Cargo.*', 'Makefile', '.github/workflows/packaging.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixtures:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Linux native relocation test prerequisite
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo test --locked --all-features
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo build --locked --bin underglow
      - name: Fixtures and isolated real-engine integration (synthetic SDKs only)
        run: WOOTING_TEST_BINARY="$PWD/target/debug/underglow" python3 -m unittest discover -s packaging/tests -v
      - name: Shell syntax (no installation or service activation)
        run: for script in scripts/*.sh; do bash -n "$script"; done
      - name: Development watcher fixtures (no GUI or hardware)
        run: python3 -m unittest discover -s scripts/tests -v
